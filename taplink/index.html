<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d8e7f6" />
    <title>Wake.md — Ссылки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #d8e7f6;
            --ink: #1b1a56;
            --ink-soft: rgba(27, 26, 86, 0.6);
            --night: #102129;
            --yellow: #ffc700;
            --white: #ffffff;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: "Montserrat Alternates", "Montserrat", sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .title {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            color: var(--ink);
        }

        .links {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            background: var(--white);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(27, 26, 86, 0.08);
            gap: 16px;
        }

        .link-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(27, 26, 86, 0.06);
        }

        .link-btn--primary {
            background: var(--yellow);
        }

        .link-btn--outline {
            background: transparent;
            border: 1px solid var(--ink-soft);
            box-shadow: none;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 14px;
            color: var(--ink-soft);
            text-align: center;
        }
    </style>
</head>

<body>
    <header class="header">
        <img src="../assets/design/brand/logo.webp" alt="Wake.md" class="logo" />
        <h1 class="title">Wake.md</h1>
    </header>

                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>

                    <path d="M7.99698 12.6902L16.987 20.6002C17.0909 20.6922 17.2169 20.7556 17.3527 20.7841C17.4885 20.8127 17.6294 20.8054 17.7615 20.763C17.8936 20.7207 18.0125 20.6447 18.1064 20.5425C18.2002 20.4403 18.2659 20.3155 18.297 20.1802L22.057 3.76022C22.0885 3.61881 22.081 3.4715 22.0354 3.334C21.9897 3.1965 21.9076 3.07399 21.7977 2.97953C21.6879 2.88507 21.5544 2.82222 21.4116 2.79769C21.2688 2.77315 21.1221 2.78785 20.987 2.84022L2.52698 10.0902C1.78698 10.3802 1.88698 11.4602 2.66698 11.6202L7.99698 12.6902Z"></path>

                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>

                </svg>

    </div>

    <footer class="footer">
        © 2026 Wake.md
    </footer>
</body>

</html>
